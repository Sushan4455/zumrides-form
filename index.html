<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Data Entry</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="header-title">Data Entry</h1>
        </header>

        <form id="workForm">
            <!-- Segmented Control for Task -->
            <div class="segmented-control" id="taskSegment">
                <label class="segment-label">
                    <input type="radio" name="taskType" value="routine" checked>
                    <span class="segment-text">Routine</span>
                </label>
                <label class="segment-label">
                    <input type="radio" name="taskType" value="station">
                    <span class="segment-text">Station</span>
                </label>
                <label class="segment-label">
                    <input type="radio" name="taskType" value="overall">
                    <span class="segment-text">Overall</span>
                </label>
            </div>

            <!-- Staff Selection -->
            <div class="form-group" style="margin-bottom: 2rem;">
                <label class="field-label">Staff Name</label>
                <select class="input-field" id="staffName" name="staffName" required>
                    <option value="" disabled selected>Who is checking?</option>
                    <option value="Kabir">Kabir</option>
                    <option value="Laxman">Laxman</option>
                    <option value="Anish">Anish</option>
                    <option value="Surya">Surya</option>
                </select>
                <p id="assignmentNote" style="font-size: 0.75rem; color: #10b981; margin-top: 0.5rem; display: none; font-weight: 500;"></p>
            </div>

            <div id="dynamic-sections">
                <!-- Routine Checkup Section -->
                <div id="section-routine" class="task-section">
                    <label class="section-title">Routine Checkup Entries</label>
                    <div id="routine-cycles-container"></div>
                    <button type="button" id="addRoutineCycleBtn" class="btn-ghost">+ Add another cycle</button>
                </div>

                <!-- Station Visit Section -->
                <div id="section-station" class="task-section hidden">
                    <label class="section-title">Station Visit Cycles (up to 5)</label>
                    <div id="station-cycles-container"></div>
                    <button type="button" id="addStationCycleBtn" class="btn-ghost">+ Add another cycle</button>
                </div>

                <!-- Overall Checkup Section -->
                <div id="section-overall" class="task-section hidden">
                    <label class="section-title">Overall Checkup Entries</label>
                    <div id="overall-cycles-container"></div>
                    <button type="button" id="addCycleBtn" class="btn-ghost">+ Add another cycle</button>
                </div>
            </div>

            <div class="bottom-actions">
                <button type="button" id="clearBtn" class="btn-clear">Clear</button>
                <button type="submit" id="submitBtn" class="btn-submit">Add</button>
            </div>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
